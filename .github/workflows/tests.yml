name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is what macOS ships with Apple's command-line tools; 3.13 catches newer breakage.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # PyYAML is test-only (the relationship test parses frontmatter). The plugin itself stays stdlib-only.
      - run: python -m pip install --quiet pyyaml
      - run: python -m unittest discover -s tests -v
